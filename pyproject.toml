[project]
name = "medical-triage-mlops"
version = "0.1.0"
description = "Medical report urgency triage API with MLOps pipeline"
authors = [
    {name = "GFurts",email = "gabriel.g.furtado30@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "notebook (>=7.6.3,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = ["I"]